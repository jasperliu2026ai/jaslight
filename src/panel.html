<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:340px; height:520px; background:transparent; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,sans-serif; color:#e2e8f0; }

  .panel {
    width:340px; height:520px;
    background:rgba(15,15,20,0.92);
    border:1px solid rgba(255,255,255,0.08);
    border-radius:16px;
    backdrop-filter:blur(20px);
    display:flex; flex-direction:column;
  }

  /* 头部：只有头部区域可拖拽 */
  .header {
    padding:14px 16px 10px;
    display:flex; align-items:center; gap:10px;
    border-bottom:1px solid rgba(255,255,255,0.06);
    flex-shrink:0;
    -webkit-app-region:drag;
  }
  .state-dot {
    width:10px; height:10px; border-radius:50%;
    box-shadow:0 0 8px currentColor;
    flex-shrink:0;
  }
  .state-label { font-size:13px; font-weight:600; }
  .close-btn {
    margin-left:auto; width:18px; height:18px; border-radius:50%;
    background:rgba(255,255,255,0.1); border:none; cursor:pointer;
    color:#888; font-size:12px; display:flex; align-items:center; justify-content:center;
    -webkit-app-region:no-drag;
  }
  .close-btn:hover { background:rgba(255,255,255,0.2); color:#fff; }

  /* 信息流 */
  .feed { flex:1; overflow-y:auto; padding:10px 12px; display:flex; flex-direction:column; gap:6px; -webkit-app-region:no-drag; }
  .feed::-webkit-scrollbar { width:4px; }
  .feed::-webkit-scrollbar-track { background:transparent; }
  .feed::-webkit-scrollbar-thumb { background:rgba(255,255,255,0.15); border-radius:2px; }

  .entry {
    display:flex; align-items:flex-start; gap:8px;
    padding:8px 10px; border-radius:10px;
    background:rgba(255,255,255,0.04);
    border:1px solid rgba(255,255,255,0.06);
    animation: slideIn 0.25s ease;
  }
  @keyframes slideIn { from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }

  .entry-icon { font-size:14px; flex-shrink:0; margin-top:1px; }
  .entry-body { flex:1; min-width:0; }
  .entry-text { font-size:12px; color:#cbd5e1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .entry-time { font-size:10px; color:#475569; margin-top:2px; }

  .entry.type-decision { border-color:rgba(239,68,68,0.3); background:rgba(239,68,68,0.07); }
  .entry.type-done     { border-color:rgba(59,130,246,0.3); background:rgba(59,130,246,0.07); }
  .entry.type-file     { border-color:rgba(245,158,11,0.2); }
  .entry.type-cmd      { border-color:rgba(34,197,94,0.2); }

  .empty { color:#475569; font-size:12px; text-align:center; padding:40px 0; }

  /* 底部 */
  .footer {
    padding:10px 14px;
    border-top:1px solid rgba(255,255,255,0.06);
    display:flex; gap:8px;
    flex-shrink:0; -webkit-app-region:no-drag;
  }
  .btn {
    flex:1; padding:7px 0; border-radius:8px;
    background:rgba(255,255,255,0.07); border:1px solid rgba(255,255,255,0.1);
    color:#94a3b8; font-size:11px; cursor:pointer;
  }
  .btn:hover { background:rgba(255,255,255,0.13); color:#e2e8f0; }
</style>
</head>
<body>
<div class="panel">
  <div class="header">
    <div class="state-dot" id="dot"></div>
    <span class="state-label" id="state-label">未监控</span>
    <button class="close-btn" id="closeBtn">✕</button>
  </div>
  <div class="feed" id="feed">
    <div class="empty">等待 AI 活动…</div>
  </div>
  <div class="footer">
    <button class="btn" onclick="ipc('jump-to-app')">跳转 AI</button>
    <button class="btn" onclick="ipc('open-stats')">报表</button>
    <button class="btn" onclick="ipc('open-settings')">设置</button>
    <button class="btn" onclick="ipc('toggle-float')">悬浮灯</button>
  </div>
</div>

<script>
const { ipcRenderer } = require('electron');
const ICONS = { file:'📄', cmd:'⚡', decision:'🔴', done:'✅', system:'ℹ️', default:'💬' };
const STATES = {};

function ipc(ch) { ipcRenderer.send(ch); }

document.getElementById('closeBtn').addEventListener('click', () => ipcRenderer.send('close-win'));

ipcRenderer.on('state-change', (_, d) => {
  const { state, states, multiSource, perSource } = d;
  Object.assign(STATES, states);
  const s = states[state] || { color:'#6b7280', label:'未监控' };
  document.getElementById('dot').style.cssText = `background:${s.color};color:${s.color}`;
  let label = s.label;
  if (multiSource && perSource) {
    const names = Object.values(perSource).map(p => p.name).join(' + ');
    if (names) label = `${s.label} · ${names}`;
  }
  document.getElementById('state-label').textContent = label;
  document.getElementById('state-label').style.color = s.color;
});

ipcRenderer.on('feed-update', (_, entries) => {
  const feed = document.getElementById('feed');
  if (!entries.length) { feed.innerHTML = '<div class="empty">等待 AI 活动…</div>'; return; }
  feed.innerHTML = entries.map(e => `
    <div class="entry type-${e.type}">
      <span class="entry-icon">${ICONS[e.type]||ICONS.default}</span>
      <div class="entry-body">
        <div class="entry-text">${e.text}</div>
        <div class="entry-time">${e.srcLabel ? e.srcLabel + ' · ' : ''}${e.time}</div>
      </div>
    </div>
  `).join('');
});

ipcRenderer.send('get-state');
ipcRenderer.send('get-feed');
</script>
</body>
</html>
